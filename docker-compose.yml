# ============================================
# FoodChain AI - Docker Compose
# ============================================
# Start all services: docker-compose up --build

version: "3.9"

services:
  # ---------- PostgreSQL Database ----------
  db:
    image: postgres:16-alpine
    container_name: foodchain-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodchain_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-foodchain_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodchain}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- FastAPI Backend ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodchain-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-foodchain}:${POSTGRES_PASSWORD:-foodchain_secret_2024}@db:5432/${POSTGRES_DB:-foodchain_db}
      SECRET_KEY: ${SECRET_KEY:-foodchain-dev-secret-key-change-in-production-2024}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://frontend:3000"]}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  # ---------- Next.js Frontend ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodchain-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
